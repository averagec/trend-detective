[project]
name = "trend-detective"
version = "0.1.0"
description = "NASA Space Apps 2026: Be An Earth System Trend Detective"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "h5py", "harmony-py", "flask", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# web/ is the imported front-end site (its own Python asset scripts), not part of the engine.
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
