[project]
name = "trend-detective"
version = "0.1.0"
description = "NASA Space Apps 2026: Be An Earth System Trend Detective"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "h5py", "harmony-py", "flask", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Older ingest-kit scripts written in a compact style (long lines, one-line statements).
# Style only; imports are still checked. Tidy them when next edited, then drop these lines.
"scripts/pull_nasa.py" = ["E501", "E701", "E702"]
"scripts/test_pull_nasa.py" = ["E501", "E701", "E702"]
